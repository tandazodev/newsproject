server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: notificaciones
  jackson:
    # El contrato de eventos y las respuestas REST usan snake_case
    property-naming-strategy: SNAKE_CASE
  datasource:
    # En Docker llegan SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (docker-compose.yml)
    url: jdbc:postgresql://localhost:5432/notificaciones
    hikari:
      connection-timeout: 2000
  sql:
    init:
      mode: always        # ejecuta schema.sql (CREATE TABLE IF NOT EXISTS)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: 3s
    listener:
      simple:
        # Ack solo despues de que el listener termina bien (docs/eventos.md, regla 2).
        acknowledge-mode: auto
        # Error transitorio -> nack con requeue; la cola quorum cuenta las entregas
        # y tras 3 manda el mensaje a su .dlq. Un mensaje invalido lanza
        # AmqpRejectAndDontRequeueException y va directo a la .dlq.
        default-requeue-rejected: true
        retry:
          enabled: false
        prefetch: 10
        missing-queues-fatal: false

# Retención de alertas y artículos recientes (docs/arquitectura.md, sección 6)
alerts:
  retention-days: ${ALERTS_RETENTION_DAYS:7}
  cleanup-interval-ms: ${ALERTS_CLEANUP_INTERVAL_MS:3600000}
  cleanup-initial-delay-ms: ${ALERTS_CLEANUP_INITIAL_DELAY_MS:60000}
