; PostgreSQL solo escucha dentro del contenedor (localhost).
[program:db]
command=docker-entrypoint.sh postgres -c listen_addresses=localhost
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; El backend espera a que PostgreSQL acepte conexiones y luego arranca.
; Los reintentos a RabbitMQ los hace Spring AMQP (reconexion automatica).
[program:api]
command=sh -c 'until pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do sleep 1; done; exec /opt/java/openjdk/bin/java -XX:MaxRAMPercentage=60 -jar /app/notificaciones.jar --server.port=8080'
directory=/app
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
